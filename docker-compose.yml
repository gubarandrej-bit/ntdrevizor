services:
  ntdrevizor:
    build: .
    image: ntdrevizor:1.0.0
    container_name: ntdrevizor
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATA_DIR: /opt/ntdrevizor/data
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      # Ollama на хосте (если установлен)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ntd_data:/opt/ntdrevizor/data
      - ./data/ntd_catalog.json:/opt/ntdrevizor/data/ntd_catalog.json:ro
      - ./data/engineering_tables.json:/opt/ntdrevizor/data/engineering_tables.json:ro
      - ./data/check_catalog.json:/opt/ntdrevizor/data/check_catalog.json:ro
      - ./data/prompt_rules.md:/opt/ntdrevizor/data/prompt_rules.md:ro
    mem_limit: 12g
    cpus: 6.0
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

volumes:
  ntd_data:
